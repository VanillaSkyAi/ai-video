<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video chat — design system</title>
<style>
  /* The wrapper owns nothing but the split. Each half is the real page in a
     frame of its own, so neither theme can be approximated here. */
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-auto-rows: 100vh; } }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <iframe src="./design-system-panel.html#light" title="Light theme"></iframe>
  <iframe src="./design-system-panel.html#dark" title="Dark theme"></iframe>
</body>
</html>
